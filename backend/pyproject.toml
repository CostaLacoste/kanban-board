[project]
name = "flowboard-api"
version = "0.1.0"
description = "FastAPI backend for Flowboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard-no-fastapi-cloud-cli]>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

