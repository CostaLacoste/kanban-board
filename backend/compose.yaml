services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flowboard
      POSTGRES_USER: flowboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - flowboard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowboard -d flowboard"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://flowboard:${POSTGRES_PASSWORD}@postgres:5432/flowboard
      FLOWBOARD_AUTH_REQUIRED: "true"
      FLOWBOARD_AUTH_SECRET: ${FLOWBOARD_AUTH_SECRET:?Set FLOWBOARD_AUTH_SECRET}
      FLOWBOARD_CORS_ORIGINS: ${FLOWBOARD_CORS_ORIGINS:-http://localhost:4173}
      FLOWBOARD_PUBLIC_APP_URL: ${FLOWBOARD_PUBLIC_APP_URL:-http://localhost:4173}
      FLOWBOARD_OBJECT_STORAGE_PATH: /app/data/objects
    volumes:
      - flowboard-objects:/app/data/objects
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  flowboard-postgres:
  flowboard-objects:
